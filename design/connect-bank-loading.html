<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Bank, syncing your bank - Tendd in colour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- THE THEME BEFORE THE FIRST PAINT. Three lines, inline, above the stylesheet
     on purpose: a switch that runs on DOMContentLoaded leaves one frame of white
     on every load in the dark theme, and a flash is the most visible thing a dark
     theme can get wrong. design/_nav.js draws the control and owns the same key. -->
<script>(function(){try{if(localStorage.getItem('tendd-screen-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="system/index.css">
<link rel="stylesheet" href="_screen.css">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
</head>
<body>

<!--
  Syncing your bank, node 1.3.2. The wait, and it carries no control at all:
  Link has already returned and there is nothing here to cancel. The skeleton is in the shape of the
  count and the first list, which is the promise that the wait ends in something specific.
  Assembled from system classes. No style of its own. Copy verbatim from the grey.
-->

<button class="nav-toggle" id="navToggle" aria-label="Open navigation">&#9776;</button>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="nav-brand">Tendd - UI + Visual</span>
    <button class="sidebar-close" id="sidebarClose" aria-label="Close navigation">&#10005;</button>
  </div>
  <nav class="sidebar-nav" id="ui-screen-nav"></nav>
</aside>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="layout">
<div class="stage stage-app">

<div class="app flow">

  <!-- No back control: Link has already returned and we are reading accounts.
       There is nothing here to cancel, and offering one would be theatre. -->
  <header class="appbar">
    <span class="lockup"><span class="brand" aria-hidden="true"></span><span class="wordmark">Ten<span class="dd">d<span class="hi">d</span></span></span></span>
    <span class="step">Step 2 of 3</span>
  </header>

  <main class="screen" aria-busy="true">

    <div class="textblock" role="status" aria-live="polite">
      <h1>Syncing your bank</h1>
      <p>We are reading your recurring charges, read-only. This usually takes a moment.</p>
    </div>

    <!-- The skeleton is in the shape of what is coming, which is the count and
         the first list of the reveal. That shape is the promise that the wait
         ends in something specific, and it is why there is no spinner here. -->
    <div aria-hidden="true">
      <span class="skel total"></span>
      <div class="skel-list">
        <div class="row is-skel">
          <span class="logo is-skel"></span>
          <span class="body"><span class="skel line w60"></span><span class="skel line short"></span></span>
          <span class="skel amt-skel"></span>
        </div>
        <div class="row is-skel">
          <span class="logo is-skel"></span>
          <span class="body"><span class="skel line w40"></span><span class="skel line short"></span></span>
          <span class="skel amt-skel"></span>
        </div>
        <div class="row is-skel">
          <span class="logo is-skel"></span>
          <span class="body"><span class="skel line w70"></span><span class="skel line short"></span></span>
          <span class="skel amt-skel"></span>
        </div>
      </div>
    </div>

  </main>

</div>

</div><!-- /stage -->
</div><!-- /layout -->
<script>
(function(){var s=document.getElementById('sidebar'),o=document.getElementById('sidebarOverlay'),t=document.getElementById('navToggle'),c=document.getElementById('sidebarClose');function op(){s.classList.add('open');o.classList.add('open');}function cl(){s.classList.remove('open');o.classList.remove('open');}if(t)t.addEventListener('click',op);if(c)c.addEventListener('click',cl);if(o)o.addEventListener('click',cl);})();
</script>
<script src="_nav.js"></script>
</body>
</html>
