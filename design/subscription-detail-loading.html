<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subscription Detail, loading the detail - Tendd in colour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- THE THEME BEFORE THE FIRST PAINT. Three lines, inline, above the stylesheet
     on purpose: a switch that runs on DOMContentLoaded leaves one frame of white
     on every load in the dark theme, and a flash is the most visible thing a dark
     theme can get wrong. design/_nav.js draws the control and owns the same key. -->
<script>(function(){try{if(localStorage.getItem('tendd-screen-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="system/index.css">
<link rel="stylesheet" href="_screen.css">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
</head>
<body>

<!--
  Subscription Detail, node 2.7, the loading state: the hero is already filled
  and only the facts are still on their way.
  Assembled from system classes. This page carries no style of its own: no page-level
  style block, no style attribute, no class that design/system/ does not define.
  Structure and copy are a verbatim copy of wireframes/subscription-detail-loading.html.
  The colour layer owns the visual only, plus the merchant mark, which is the one
  thing the grey page could not carry (it renders "[logo]" in its place).
  Links to screens that are not coloured yet point back into wireframes/.
-->

<button class="nav-toggle" id="navToggle" aria-label="Open navigation">&#9776;</button>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="nav-brand">Tendd - UI + Visual</span>
    <button class="sidebar-close" id="sidebarClose" aria-label="Close navigation">&#10005;</button>
  </div>
  <nav class="sidebar-nav" id="ui-screen-nav"></nav>
</aside>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="layout">
<div class="stage stage-app">

<div class="app detail">

  <header class="appbar">
    <a class="back" href="home.html">Your subscriptions</a>
    <span class="lockup"><span class="brand" aria-hidden="true"></span><span class="wordmark">Ten<span class="dd">d<span class="hi">d</span></span></span></span>
  </header>

  <main class="screen" aria-busy="true">

    <div class="col1">

      <!-- The hero is already filled, because the list the person tapped knew
           the name and the amount. Blanking it out and asking them to wait for
           what they had a moment ago is the thing this state must not do. -->
      <div class="hero">
        <span class="logo"><img src="visuals/logos/spotify.svg" alt=""></span>
        <span>
          <h1>Spotify Premium</h1>
          <span class="amt">$11.99</span>
          <span class="cycle">a month</span>
        </span>
      </div>

      <p class="muted" role="status" aria-live="polite">Getting the details. This usually takes a moment.</p>

      <dl class="pairs" aria-hidden="true">
        <div><dt><span class="skel line"></span></dt><dd><span class="skel line"></span></dd></div>
        <div><dt><span class="skel line"></span></dt><dd><span class="skel line"></span></dd></div>
        <div><dt><span class="skel line"></span></dt><dd><span class="skel line"></span></dd></div>
        <div><dt><span class="skel line"></span></dt><dd><span class="skel line"></span></dd></div>
        <div><dt><span class="skel line"></span></dt><dd><span class="skel line"></span></dd></div>
      </dl>

      <section class="wash code" aria-hidden="true">
        <span class="skel line w60"></span>
        <span class="skel line w80"></span>
      </section>

    </div>

    <div class="col2">

      <section class="panel" aria-hidden="true">
        <h2>Recent charges</h2>
        <ul class="charges">
          <li><span class="skel line"></span><span class="skel line"></span></li>
          <li><span class="skel line"></span><span class="skel line"></span></li>
          <li><span class="skel line"></span><span class="skel line"></span></li>
        </ul>
      </section>

      <section class="trust" aria-label="Where these figures come from">
        <p>From Chase, read-only. Tendd cannot move your money.</p>
        <p>Last checked today, 9:14 AM.</p>
        <a href="../wireframes/data-privacy.html">Data and privacy</a>
      </section>

    </div>

  </main>

  <nav class="tabbar" aria-label="Global navigation">
    <a class="cur" href="home.html" aria-current="page"><span class="ic ic-home"></span>Home</a>
    <a href="alerts.html"><span class="ic ic-alerts"><span class="dot" role="img" aria-label="new alerts"></span></span>Alerts</a>
    <a href="home-savefocus.html"><span class="ic ic-save"></span>Save</a>
    <a href="settings.html"><span class="ic ic-you"></span>You</a>
  </nav>

</div>

</div><!-- /stage -->
</div><!-- /layout -->

<script>
(function(){var s=document.getElementById('sidebar'),o=document.getElementById('sidebarOverlay'),t=document.getElementById('navToggle'),c=document.getElementById('sidebarClose');function op(){s.classList.add('open');o.classList.add('open');}function cl(){s.classList.remove('open');o.classList.remove('open');}if(t)t.addEventListener('click',op);if(c)c.addEventListener('click',cl);if(o)o.addEventListener('click',cl);})();
</script>
<script src="_nav.js"></script>
</body>
</html>
