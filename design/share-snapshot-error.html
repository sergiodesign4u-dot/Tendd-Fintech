<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share Snapshot, could not create the card - Tendd in colour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- THE THEME BEFORE THE FIRST PAINT. Three lines, inline, above the stylesheet
     on purpose: a switch that runs on DOMContentLoaded leaves one frame of white
     on every load in the dark theme, and a flash is the most visible thing a dark
     theme can get wrong. design/_nav.js draws the control and owns the same key. -->
<script>(function(){try{if(localStorage.getItem('tendd-screen-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="system/index.css">
<link rel="stylesheet" href="_screen.css">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
</head>
<body>

<!--
  Share failed, node 4.11.2. Ours to own: the sentence says what failed and
  hands back the one action that retries it.

  Assembled from system classes. This page carries no style of its own: no page-level style
  block, no style attribute, no class design/system/ does not define. Structure and copy are a
  verbatim copy of the grey twin; class names come from the renaming map in
  design/kit/docs/inventory.md and from nowhere else.
-->

<button class="nav-toggle" id="navToggle" aria-label="Open navigation">&#9776;</button>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="nav-brand">Tendd - UI + Visual</span>
    <button class="sidebar-close" id="sidebarClose" aria-label="Close navigation">&#10005;</button>
  </div>
  <nav class="sidebar-nav" id="ui-screen-nav"></nav>
</aside>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="layout">
<div class="stage stage-app">

<div class="app flow">

  <header class="appbar">
    <a class="back" href="cancel-win.html">Back</a>
    <span class="lockup"><span class="brand" aria-hidden="true"></span><span class="wordmark">Ten<span class="dd">d<span class="hi">d</span></span></span></span>
  </header>

  <main class="screen">

    <!-- Node 4.11.2. The card failed, the win did not. Saying which of the two
         broke is the whole job of this state: a person who just cancelled
         something must never wonder whether that was undone. -->
    <div class="textblock status" role="status" aria-live="polite">
      <h1>We could not create the card</h1>
      <p>Nothing is wrong with your account, and your cancel win is saved. This is only the picture.</p>
    </div>

    <div class="actions">
      <a class="btn primary" href="share-snapshot.html">Try again</a>
      <a class="btn" href="home.html">Back to your subscriptions</a>
    </div>

    <p class="muted">Nothing was shared, and nothing was posted anywhere.</p>

  </main>

</div>

</div><!-- /stage -->
</div><!-- /layout -->
<script>
(function(){var s=document.getElementById('sidebar'),o=document.getElementById('sidebarOverlay'),t=document.getElementById('navToggle'),c=document.getElementById('sidebarClose');function op(){s.classList.add('open');o.classList.add('open');}function cl(){s.classList.remove('open');o.classList.remove('open');}if(t)t.addEventListener('click',op);if(c)c.addEventListener('click',cl);if(o)o.addEventListener('click',cl);})();
</script>
<script src="_nav.js"></script>
</body>
</html>
