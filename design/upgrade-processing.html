<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upgrade, setting up your plan - Tendd in colour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit/kit.css">
</head>
<body>

<!--
  Upgrade, node 5.13.1, the wait: setting up your Pro plan.
  It exists because the payment provider owns its own sheet and we own the few
  seconds around it, in our own voice. It is the only screen in the set with no
  way out at all, so the colour layer gives it nothing to click: no accent, no
  chip to press, a skeleton in the shape of what is coming and one promise.
  Assembled from kit classes. This page carries no page-level style block, no
  style attribute, and no class that kit.css does not define.
  Structure and copy are a verbatim copy of wireframes/upgrade-processing.html.
  Links to screens that are not coloured yet point back into wireframes/.
-->

<button class="nav-toggle" id="navToggle" aria-label="Open navigation">&#9776;</button>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="nav-brand">Tendd - UI + Visual</span>
    <button class="sidebar-close" id="sidebarClose" aria-label="Close navigation">&#10005;</button>
  </div>
  <nav class="sidebar-nav" id="ui-screen-nav"></nav>
</aside>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="layout">
<div class="stage stage-app">

<div class="app flow">

  <!-- Node 5.13.1. The payment provider owns its own sheet; we own the wait
       around it, in our own voice. No close here: a person must not be able to
       leave in the middle of a charge and wonder whether it went through. -->
  <header class="appbar">
    <span class="wordmark">Tendd</span>
    <span class="plan">Free</span>
  </header>

  <main class="screen" aria-busy="true">

    <div class="state" role="status" aria-live="polite">
      <h1>Setting up your Pro plan</h1>
      <p>This takes a few seconds. Do not close this page, and nothing is charged twice if it takes a moment longer.</p>
    </div>

    <div aria-hidden="true">
      <span class="skel line w70"></span>
      <span class="skel line w50"></span>
    </div>

    <!-- What happens next, stated before it happens: the person returns to the
         thing they wanted, and there is no celebration screen on the way. -->
    <p class="consequence spaced">When it is done you go straight back to <strong>Your trends</strong>, open.</p>

  </main>

</div>

</div><!-- /stage -->
</div><!-- /layout -->

<script>
(function(){var s=document.getElementById('sidebar'),o=document.getElementById('sidebarOverlay'),t=document.getElementById('navToggle'),c=document.getElementById('sidebarClose');function op(){s.classList.add('open');o.classList.add('open');}function cl(){s.classList.remove('open');o.classList.remove('open');}if(t)t.addEventListener('click',op);if(c)c.addEventListener('click',cl);if(o)o.addEventListener('click',cl);})();
</script>
<script src="_nav.js"></script>
</body>
</html>
