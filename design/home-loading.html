<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home, refreshing - Tendd in colour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- THE THEME BEFORE THE FIRST PAINT. Three lines, inline, above the stylesheet
     on purpose: a switch that runs on DOMContentLoaded leaves one frame of white
     on every load in the dark theme, and a flash is the most visible thing a dark
     theme can get wrong. design/_nav.js draws the control and owns the same key. -->
<script>(function(){try{if(localStorage.getItem('tendd-screen-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="system/index.css">
<link rel="stylesheet" href="_screen.css">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
</head>
<body>

<!--
  Home / Subscription List, node 2.6, the loading state: refreshing.
  Assembled from system classes. This page carries no style of its own: no page-level
  style block, no style attribute, no class that design/system/ does not define.
  Structure and copy are a verbatim copy of wireframes/home-loading.html. The
  colour layer owns the visual only; a skeleton logo carries no mark.
  Links to screens that are not coloured yet point back into wireframes/.
-->

<button class="nav-toggle" id="navToggle" aria-label="Open navigation">&#9776;</button>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="nav-brand">Tendd - UI + Visual</span>
    <button class="sidebar-close" id="sidebarClose" aria-label="Close navigation">&#10005;</button>
  </div>
  <nav class="sidebar-nav" id="ui-screen-nav"></nav>
</aside>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="layout">
<div class="stage stage-app">

<div class="app">

  <header class="appbar">
    <span class="lockup"><span class="brand" aria-hidden="true"></span><span class="wordmark">Ten<span class="dd">d<span class="hi">d</span></span></span></span>
    <a class="acct" href="settings.html" aria-label="Hi Emma, you are on the free plan, open your account">Hi, Emma<span class="chip">Free</span></a>
  </header>
  <main class="screen">

    <div class="head">
      <section class="summary" role="status">
        <h1>Getting your subscriptions</h1>
        <p class="muted">This usually takes a moment.</p>
        <span class="skel total" aria-hidden="true"></span>
      </section>
    </div>

    <!-- A skeleton in the shape of the content, never a spinner over the screen -->
    <div class="groups">

      <section class="group">
        <div class="group-head" aria-hidden="true">
          <span class="skel line"></span>
          <span class="skel line"></span>
        </div>
        <ul>
          <li><div class="row is-skel" aria-hidden="true">
            <span class="logo is-skel"></span>
            <span class="body"><span class="skel line w60"></span><span class="skel line short"></span></span>
            <span class="skel amt-skel"></span>
          </div></li>
          <li><div class="row is-skel" aria-hidden="true">
            <span class="logo is-skel"></span>
            <span class="body"><span class="skel line w40"></span><span class="skel line short"></span></span>
            <span class="skel amt-skel"></span>
          </div></li>
          <li><div class="row is-skel" aria-hidden="true">
            <span class="logo is-skel"></span>
            <span class="body"><span class="skel line w70"></span><span class="skel line short"></span></span>
            <span class="skel amt-skel"></span>
          </div></li>
          <li><div class="row is-skel" aria-hidden="true">
            <span class="logo is-skel"></span>
            <span class="body"><span class="skel line w50"></span><span class="skel line short"></span></span>
            <span class="skel amt-skel"></span>
          </div></li>
        </ul>
      </section>

      <section class="group">
        <div class="group-head" aria-hidden="true">
          <span class="skel line"></span>
          <span class="skel line"></span>
        </div>
        <ul>
          <li><div class="row is-skel" aria-hidden="true">
            <span class="logo is-skel"></span>
            <span class="body"><span class="skel line w60"></span><span class="skel line short"></span></span>
            <span class="skel amt-skel"></span>
          </div></li>
          <li><div class="row is-skel" aria-hidden="true">
            <span class="logo is-skel"></span>
            <span class="body"><span class="skel line w40"></span><span class="skel line short"></span></span>
            <span class="skel amt-skel"></span>
          </div></li>
          <li><div class="row is-skel" aria-hidden="true">
            <span class="logo is-skel"></span>
            <span class="body"><span class="skel line w70"></span><span class="skel line short"></span></span>
            <span class="skel amt-skel"></span>
          </div></li>
        </ul>
      </section>

    </div><!-- /groups -->

  </main>
  <nav class="tabbar" aria-label="Global navigation">
    <a class="cur" href="home.html" aria-current="page"><span class="ic ic-home"></span>Home</a>
    <a href="history-trends-locked.html"><span class="ic ic-trends"></span>Trends</a>
    <a href="alerts.html"><span class="ic ic-alerts"><span class="dot" role="img" aria-label="new alerts"></span></span>Alerts</a>
    <a href="home-savefocus.html"><span class="ic ic-save"></span>Save</a>
    <a href="settings.html"><span class="ic ic-you"></span>You</a>
  </nav>
</div>

</div><!-- /stage -->
</div><!-- /layout -->

<script>
(function(){var s=document.getElementById('sidebar'),o=document.getElementById('sidebarOverlay'),t=document.getElementById('navToggle'),c=document.getElementById('sidebarClose');function op(){s.classList.add('open');o.classList.add('open');}function cl(){s.classList.remove('open');o.classList.remove('open');}if(t)t.addEventListener('click',op);if(c)c.addEventListener('click',cl);if(o)o.addEventListener('click',cl);})();
</script>
<script src="_nav.js"></script>
</body>
</html>
