<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guided Reveal, nothing to reveal yet - Tendd in colour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="system/index.css">
<link rel="stylesheet" href="_screen.css">
</head>
<body>

<!--
  Guided Reveal, nothing to reveal yet. The guard on node 1.5: the manual path
  can arrive here before anything has been added, and the reveal has to hold
  that without reading as a failure.
  Assembled from system classes. This page carries no page-level style block, no
  style attribute, and no class that design/system/ does not define.
  Structure and copy are a verbatim copy of wireframes/guided-reveal-empty.html.
  It adds nothing to the kit: .state, .actions, .btn.primary and .quiet were all
  in place before it, which is the point of a state page arriving last.
-->

<button class="nav-toggle" id="navToggle" aria-label="Open navigation">&#9776;</button>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="nav-brand">Tendd - UI + Visual</span>
    <button class="sidebar-close" id="sidebarClose" aria-label="Close navigation">&#10005;</button>
  </div>
  <nav class="sidebar-nav" id="ui-screen-nav"></nav>
</aside>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="layout">
<div class="stage stage-app">

<div class="app flow">

  <header class="appbar">
    <span class="wordmark">Tendd</span>
    <span class="step">Step 3 of 3</span>
  </header>

  <main class="screen">

    <!-- The reveal arrived with nothing to reveal. It guards against the case
         where the manual path ends here before anything has been added. -->
    <div class="textblock status" role="status" aria-live="polite">
      <h1>Nothing to reveal yet</h1>
      <p>Add at least one subscription and your list appears here. Even a partial list is saved, so you can come back any time.</p>
    </div>

    <div class="actions">
      <a class="btn primary" href="add-subscription.html">Add a subscription</a>
    </div>

    <p class="quiet"><a href="home-empty.html">Do this later</a></p>

  </main>

</div>

</div><!-- /stage -->
</div><!-- /layout -->

<script>
(function(){var s=document.getElementById('sidebar'),o=document.getElementById('sidebarOverlay'),t=document.getElementById('navToggle'),c=document.getElementById('sidebarClose');function op(){s.classList.add('open');o.classList.add('open');}function cl(){s.classList.remove('open');o.classList.remove('open');}if(t)t.addEventListener('click',op);if(c)c.addEventListener('click',cl);if(o)o.addEventListener('click',cl);})();
</script>
<script src="_nav.js"></script>
</body>
</html>
