<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History and Trends, loading history - Tendd in colour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- THE THEME BEFORE THE FIRST PAINT. Three lines, inline, above the stylesheet
     on purpose: a switch that runs on DOMContentLoaded leaves one frame of white
     on every load in the dark theme, and a flash is the most visible thing a dark
     theme can get wrong. design/_nav.js draws the control and owns the same key. -->
<script>(function(){try{if(localStorage.getItem('tendd-screen-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="system/index.css">
<link rel="stylesheet" href="_screen.css">
  <script src="system/behaviour.js" defer></script>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
</head>
<body>

<!--
  History and Trends, node 5.12, the loading state: adding up your last few months.
  It exists because the chart is the slowest thing the product draws, and the wait
  has to keep the frame the numbers will land in rather than cover the screen with
  a spinner. The colour layer owns the visual only; a skeleton logo carries no mark.
  Assembled from system classes. This page carries no page-level style block, no
  style attribute, and no class that design/system/ does not define.
  Structure and copy are a verbatim copy of wireframes/history-trends-loading.html.
  Links to screens that are not coloured yet point back into wireframes/.
-->

<button class="nav-toggle" id="navToggle" aria-label="Open navigation">&#9776;</button>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="nav-brand">Tendd - UI + Visual</span>
    <button class="sidebar-close" id="sidebarClose" aria-label="Close navigation">&#10005;</button>
  </div>
  <nav class="sidebar-nav" id="ui-screen-nav"></nav>
</aside>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="layout">
<div class="stage stage-app">

<div class="app">

  <header class="appbar">
    <a class="back" href="home.html">Your subscriptions</a>
    <span class="lockup"><span class="brand" aria-hidden="true"></span><span class="wordmark">Ten<span class="dd">d<span class="hi">d</span></span></span></span>
    <span class="chip">Pro</span>
  </header>

  <main class="screen" aria-busy="true">

    <!-- STRUCTURE FOLLOWS THE SCREEN IT IS THE WAIT FOR, 2026-08-19. The Pro view
         gained Home's head and a two-column body on the founder's decision, and a
         skeleton that is not the shape of what arrives is a second layout the person
         has to re-read the moment it lands. The grey original carries the argument. -->
    <div class="head">

      <div class="textblock">
        <h1>Your trends</h1>
        <p role="status" aria-live="polite">Adding up your last few months. This usually takes a moment.</p>
      </div>

      <!-- The range control is real while the numbers arrive: it is the frame, and
           it does not move when they land. It carries no data here, so behaviour.js
           leaves it alone - there is nothing yet for it to switch. -->
      <div class="range" role="group" aria-label="Choose a time range">
        <button type="button" aria-pressed="true">3 months</button>
        <button type="button" aria-pressed="false">6 months</button>
        <button type="button" aria-pressed="false">12 months</button>
      </div>

    </div>

    <div aria-hidden="true">
      <span class="skel line w80"></span>
      <span class="skel line w50"></span>
    </div>

    <!-- A skeleton in the shape of the chart, never a spinner over the screen:
         the same rule as every other wait in this product. The frame inside the
         box is the frame and not the data: three gridlines are true before the
         numbers arrive and do not move when they land, which is the same reason
         the range control above is real rather than greyed. The literal [chart]
         that stood here until 2026-08-12 was the wireframe's placeholder
         notation reading as a note to the team, printed to the person.
         It is a direct child of the screen since 2026-08-19, which is what gives it
         the 300px the loaded chart takes at this width: a box that grows when the
         data lands is the jump a skeleton exists to prevent. -->
    <div class="chart" aria-hidden="true"><svg viewBox="0 0 300 100" preserveAspectRatio="none" aria-hidden="true" focusable="false"></svg></div>

    <div class="grid roomy">

      <section class="group" aria-hidden="true">
        <div class="group-head"><span class="skel line"></span><span class="skel line"></span></div>
        <ul>
          <li><div class="row is-skel">
            <span class="logo is-skel"></span>
            <span class="body"><span class="skel line w60"></span><span class="skel line w80"></span></span>
          </div></li>
          <li><div class="row is-skel">
            <span class="logo is-skel"></span>
            <span class="body"><span class="skel line w50"></span><span class="skel line w70"></span></span>
          </div></li>
          <li><div class="row is-skel">
            <span class="logo is-skel"></span>
            <span class="body"><span class="skel line w70"></span><span class="skel line w60"></span></span>
          </div></li>
        </ul>
      </section>

      <!-- The second column is the category bars with no lengths yet. The track is
           the whole skeleton it needs: an empty track IS what a bar looks like before
           its figure arrives, so there is no grey block standing in for one. -->
      <section class="group" aria-hidden="true">
        <div class="group-head"><span class="skel line"></span><span class="skel line"></span></div>
        <ul class="bars">
          <li><span class="skel line w60"></span><span class="skel line w50"></span><span class="bar"></span></li>
          <li><span class="skel line w50"></span><span class="skel line w50"></span><span class="bar"></span></li>
          <li><span class="skel line w70"></span><span class="skel line w50"></span><span class="bar"></span></li>
          <li><span class="skel line w40"></span><span class="skel line w50"></span><span class="bar"></span></li>
          <li><span class="skel line w60"></span><span class="skel line w50"></span><span class="bar"></span></li>
        </ul>
      </section>

    </div>

  </main>

  <nav class="tabbar" aria-label="Global navigation">
    <a href="home.html"><span class="ic ic-home"></span>Home</a>
    <a class="cur" href="history-trends-loading.html" aria-current="page"><span class="ic ic-trends"></span>Trends</a>
    <a href="alerts.html"><span class="ic ic-alerts"><span class="dot" role="img" aria-label="new alerts"></span></span>Alerts</a>
    <a href="home-savefocus.html"><span class="ic ic-save"></span>Save</a>
    <a href="settings.html"><span class="ic ic-you"></span>You</a>
  </nav>

</div>

</div><!-- /stage -->
</div><!-- /layout -->

<script>
(function(){var s=document.getElementById('sidebar'),o=document.getElementById('sidebarOverlay'),t=document.getElementById('navToggle'),c=document.getElementById('sidebarClose');function op(){s.classList.add('open');o.classList.add('open');}function cl(){s.classList.remove('open');o.classList.remove('open');}if(t)t.addEventListener('click',op);if(c)c.addEventListener('click',cl);if(o)o.addEventListener('click',cl);})();
</script>
<script src="_nav.js"></script>
</body>
</html>
