<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shell - Tendd component kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- THE THEME BEFORE THE FIRST PAINT. Three lines, inline, above the stylesheet
     on purpose: a switch that runs on DOMContentLoaded leaves one frame of white
     on every load in the dark theme, and a flash is the most visible thing a dark
     theme can get wrong. design/_nav.js draws the control and owns the same key.
     It is in the SHELL and not only in the copies, because this file is the
     template: a screen made from it tomorrow gets the behaviour without being
     told, which is the same reason the switch is drawn by the script. -->
<script>(function(){try{if(localStorage.getItem('tendd-screen-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="../system/index.css">
<!-- The stand's own look and the roadmap chrome. This page linked the system and
     nothing else, which was survivable while kit.css declared the drawer, and
     stopped being so the day kit.css was deleted: measured at a 1280 viewport,
     `.sidebar` computed `position: static` and 1280px wide, so the roadmap laid
     itself across the page as an ordinary block. Same repair as kit.html got,
     and the smoke test is not weakened by it: the shell is still drawn by the
     system alone, and these two files own the reviewer chrome only. -->
<link rel="stylesheet" href="_page.css">
<link rel="stylesheet" href="../../_nav.css">
<!-- AND THE THIRD ONE, added 2026-08-12 by the dark stress test. The panel this
     page draws is the PRODUCT's panel, not the stand's: it loads ../_nav.js, so
     the rows come out as `.scr-link` and `.scr-back`, and those two classes are
     declared in design/_screen.css alone. Linking _page.css gave the drawer its
     box and left its rows unstyled, which in the light theme is the browser's
     #0000EE at 8.4:1 and looks like a plain list of links. In the dark theme the
     same rows measure 1.81:1. A copy of this file in design/ loads _screen.css
     as `_screen.css`; from here the path is one level up. -->
<link rel="stylesheet" href="../_screen.css">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
</head>
<body>

<!--
  THE SHELL. Every coloured screen is a copy of this file with the middle filled in.

  Two paths change when you copy it up into design/:
    ../system/index.css   becomes  system/index.css
    ../_nav.js            becomes  _nav.js
  A copy in design/ also loads _screen.css beside it, which draws the reviewer's
  chrome (.layout, .stage, .sidebar and the toggle) around the product.

  The one rule this file exists to enforce: a screen carries NO style of its own.
  Not a <style> block, not a style attribute, not a class invented on the page.
  A screen is assembled from system classes. If a detail is missing, it goes into
  the system first (the component's css plus its page in design/kit/ plus
  docs/inventory.md) and onto the screen second. A rule written on a screen looks
  flawless in the browser and becomes drift the next time the system moves.

  THE THREE FORMS OF THE SHELL, chosen on the <main> element:
    .app              the steady state: app bar, screen, tab bar
    .app.flow         the onboarding chain: app bar, screen, and NO tab bar
    .app.detail       one object in focus, two columns from container 900

  The layout is driven by CONTAINER queries, not media queries, so a screen
  behaves by the width it is given rather than by the width of the browser.
  At container 760 the tab bar becomes a 220px left rail and the app bar folds
  into its top. At 1340 the two densest screens gain a third pane.
-->

<button class="nav-toggle" id="navToggle" aria-label="Open navigation">&#9776;</button>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="nav-brand">Tendd - UI + Visual</span>
    <button class="sidebar-close" id="sidebarClose" aria-label="Close navigation">&#10005;</button>
  </div>
  <nav class="sidebar-nav" id="ui-screen-nav"></nav>
</aside>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="layout">
<div class="stage stage-app">

<!-- .layout and .stage are the REVIEW frame, not the product. They host the
     navigation panel and they do not travel to a real build. Everything from
     <main> down is the product. -->

<main class="app" aria-label="Screen name">

  <!-- GC1 App header. Slots, in order: back or menu, the title or the greeting
       on the You tab, one contextual action. On the Pro cluster that third slot
       carries the plan chip instead of an action: it is status, not a thing to do. -->
  <header class="appbar">
    <a class="back" href="#">Back</a>
    <span class="lockup"><span class="brand" aria-hidden="true"></span><span class="wordmark">Ten<span class="dd">d<span class="hi">d</span></span></span></span>
    <span class="step">Step 2 of 3</span>
  </header>

  <!-- The screen body. One column on mobile. Wrap in .rows-col for a settings
       list, .form-col for a form, .col1 / .col2 for the detail's two columns. -->
  <main class="screen">

    <!-- Molecules and organisms go here, in the order the node file gives.
         Nothing in this block invents a class. -->

  </main>

  <!-- GC2 Global tab bar. Four destinations, icon over label, the current one
       petrol. A quiet dot may sit on Alerts; there is never a count.
       Removed entirely on .app.flow. -->
  <nav class="tabbar" aria-label="Global navigation">
    <a class="cur" href="#" aria-current="page"><span class="ic"></span>Home</a>
    <a href="#"><span class="ic"><span class="dot" role="img" aria-label="new alerts"></span></span>Alerts</a>
    <a href="#"><span class="ic"></span>Save</a>
    <a href="#"><span class="ic"></span>You</a>
  </nav>

</main>

</div><!-- /stage -->
</div><!-- /layout -->

<script>
(function(){var s=document.getElementById('sidebar'),o=document.getElementById('sidebarOverlay'),t=document.getElementById('navToggle'),c=document.getElementById('sidebarClose');function op(){s.classList.add('open');o.classList.add('open');}function cl(){s.classList.remove('open');o.classList.remove('open');}if(t)t.addEventListener('click',op);if(c)c.addEventListener('click',cl);if(o)o.addEventListener('click',cl);})();
</script>
<script src="../_nav.js"></script>
</body>
</html>
