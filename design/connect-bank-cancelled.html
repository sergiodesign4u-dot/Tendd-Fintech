<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Bank, came back without connecting - Tendd in colour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- THE THEME BEFORE THE FIRST PAINT. Three lines, inline, above the stylesheet
     on purpose: a switch that runs on DOMContentLoaded leaves one frame of white
     on every load in the dark theme, and a flash is the most visible thing a dark
     theme can get wrong. design/_nav.js draws the control and owns the same key. -->
<script>(function(){try{if(localStorage.getItem('tendd-screen-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="system/index.css">
<link rel="stylesheet" href="_screen.css">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
</head>
<body>

<!--
  Came back without connecting, node 1.3.4. Backing out of Plaid Link is a
  decision, and the screen treats it as one rather than as a failed attempt.
  Assembled from system classes. No style of its own.
-->

<button class="nav-toggle" id="navToggle" aria-label="Open navigation">&#9776;</button>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="nav-brand">Tendd - UI + Visual</span>
    <button class="sidebar-close" id="sidebarClose" aria-label="Close navigation">&#10005;</button>
  </div>
  <nav class="sidebar-nav" id="ui-screen-nav"></nav>
</aside>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="layout">
<div class="stage stage-app">

<div class="app flow">

  <header class="appbar">
    <a class="back" href="path-choice.html">Back</a>
    <span class="lockup"><span class="brand" aria-hidden="true"></span><span class="wordmark">Ten<span class="dd">d<span class="hi">d</span></span></span></span>
    <span class="step">Step 2 of 3</span>
  </header>

  <main class="screen">

    <!-- Node 1.3.4, added to the map on 2026-08-04. Plaid Link returns four
         outcomes and the map had three: a person who opened the bank screen and
         backed out had nowhere specified to land. Backing out is a decision, and
         the screen treats it as one rather than as a failed attempt. -->
    <div class="textblock status" role="status" aria-live="polite">
      <h1>You came back without connecting</h1>
      <p>Nothing was shared and nothing was lost. Both ways in are still open, and you can pick either one now.</p>
    </div>

    <div class="actions">
      <a class="btn primary" href="connect-bank.html">Connect your bank</a>
      <a class="btn" href="add-subscription.html">Add them yourself</a>
    </div>

    <p class="quiet"><a href="home-empty.html">Do this later</a></p>

  </main>

</div>

</div><!-- /stage -->
</div><!-- /layout -->
<script>
(function(){var s=document.getElementById('sidebar'),o=document.getElementById('sidebarOverlay'),t=document.getElementById('navToggle'),c=document.getElementById('sidebarClose');function op(){s.classList.add('open');o.classList.add('open');}function cl(){s.classList.remove('open');o.classList.remove('open');}if(t)t.addEventListener('click',op);if(c)c.addEventListener('click',cl);if(o)o.addEventListener('click',cl);})();
</script>
<script src="_nav.js"></script>
</body>
</html>
