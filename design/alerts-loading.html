<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alerts, loading alerts - Tendd in colour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>(function(){try{if(localStorage.getItem('tendd-screen-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="system/index.css">
<link rel="stylesheet" href="_screen.css">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
</head>
<body>

<!--
  Alerts, node 3.8.2 loading. Assembled from system classes. Structure and copy
  are a verbatim copy of wireframes/alerts-loading.html.

  A wait carries no control at all, which is usage rule U7: no button, no link
  inside the screen. The tab bar is chrome and stays, as it does on every other
  wait in the product.
-->

<button class="nav-toggle" id="navToggle" aria-label="Open navigation">&#9776;</button>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="nav-brand">Tendd - UI + Visual</span>
    <button class="sidebar-close" id="sidebarClose" aria-label="Close navigation">&#10005;</button>
  </div>
  <nav class="sidebar-nav" id="ui-screen-nav"></nav>
</aside>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="layout">
<div class="stage stage-app">

<div class="app">

  <!-- GC1 App header -->
  <header class="appbar">
    <span class="lockup"><span class="brand" aria-hidden="true"></span><span class="wordmark">Ten<span class="dd">d<span class="hi">d</span></span></span></span>
    <a class="acct" href="settings.html" aria-label="Hi Emma, you are on the free plan, open your account">Hi, Emma<span class="chip">Free</span></a>
  </header>

  <main class="screen" aria-busy="true">
   <div class="rows-col">

    <div class="textblock" role="status" aria-live="polite">
      <h1>Alerts</h1>
      <p>Checking for anything worth knowing about. This usually takes a moment.</p>
    </div>

    <!-- The skeleton keeps both group headings, because the shape of this screen
         is the answer to "is anything wrong" and the shape arrives first. -->
    <section class="group" aria-hidden="true">
      <div class="group-head"><h2>Needs you</h2></div>
      <ul class="divlist">
        <li><div class="alert">
          <span class="logo is-skel"></span>
          <span class="body"><span class="skel line w70"></span><span class="skel line w50"></span></span>
        </div></li>
      </ul>
    </section>

    <section class="group" aria-hidden="true">
      <div class="group-head"><h2>Just so you know</h2></div>
      <ul class="divlist">
        <li><div class="alert">
          <span class="logo is-skel"></span>
          <span class="body"><span class="skel line w60"></span><span class="skel line w50"></span></span>
        </div></li>
        <li><div class="alert">
          <span class="logo is-skel"></span>
          <span class="body"><span class="skel line w70"></span><span class="skel line w50"></span></span>
        </div></li>
        <li><div class="alert">
          <span class="logo is-skel"></span>
          <span class="body"><span class="skel line w60"></span><span class="skel line w40"></span></span>
        </div></li>
      </ul>
    </section>

   </div>
  </main>

  <!-- GC2 Global tab bar. No dot on the Alerts tab: nothing has arrived yet. -->
  <nav class="tabbar" aria-label="Global navigation">
    <a href="home.html"><span class="ic ic-home"></span>Home</a>
    <a href="history-trends-locked.html"><span class="ic ic-trends"></span>Trends</a>
    <a class="cur" href="alerts.html" aria-current="page"><span class="ic ic-alerts"></span>Alerts</a>
    <a href="home-savefocus.html"><span class="ic ic-save"></span>Save</a>
    <a href="settings.html"><span class="ic ic-you"></span>You</a>
  </nav>

</div>

</div><!-- /stage -->
</div><!-- /layout -->

<script>
(function(){var s=document.getElementById('sidebar'),o=document.getElementById('sidebarOverlay'),t=document.getElementById('navToggle'),c=document.getElementById('sidebarClose');function op(){s.classList.add('open');o.classList.add('open');}function cl(){s.classList.remove('open');o.classList.remove('open');}if(t)t.addEventListener('click',op);if(c)c.addEventListener('click',cl);if(o)o.addEventListener('click',cl);})();
</script>
<script src="_nav.js"></script>
</body>
</html>
