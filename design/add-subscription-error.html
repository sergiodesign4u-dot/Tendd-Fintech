<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Subscription, presets unavailable - Tendd in colour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- THE THEME BEFORE THE FIRST PAINT. Three lines, inline, above the stylesheet
     on purpose: a switch that runs on DOMContentLoaded leaves one frame of white
     on every load in the dark theme, and a flash is the most visible thing a dark
     theme can get wrong. design/_nav.js draws the control and owns the same key. -->
<script>(function(){try{if(localStorage.getItem('tendd-screen-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="system/index.css">
<link rel="stylesheet" href="_screen.css">
  <script src="system/behaviour.js" defer></script>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
</head>
<body>

<!--
  Add a Subscription, node 1.4, the error state: the service list did not load.
  It exists because a catalogue that is briefly gone must not become a person who
  cannot add anything. The failure is stated once, calmly, and the manual form
  stands right under it, so every failure of this node lands in the same place.
  Assembled from system classes. This page carries no page-level style block, no
  style attribute, and no class that design/system/ does not define.
  Structure and copy are a verbatim copy of wireframes/add-subscription-error.html.
  Links to screens that are not coloured yet point back into wireframes/.
-->

<button class="nav-toggle" id="navToggle" aria-label="Open navigation">&#9776;</button>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="nav-brand">Tendd - UI + Visual</span>
    <button class="sidebar-close" id="sidebarClose" aria-label="Close navigation">&#10005;</button>
  </div>
  <nav class="sidebar-nav" id="ui-screen-nav"></nav>
</aside>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="layout">
<div class="stage stage-app">

<div class="app flow">

  <header class="appbar">
    <a class="back" href="../wireframes/path-choice.html">Back</a>
    <span class="lockup"><span class="brand" aria-hidden="true"></span><span class="wordmark">Ten<span class="dd">dd</span></span></span>
    <span class="step">Step 2 of 3</span>
  </header>

  <main class="screen">

    <div class="textblock status" role="status" aria-live="polite">
      <h1>We could not load the service list</h1>
      <p>You can still add subscriptions by hand below, and the search will come back on its own.</p>
    </div>

    <div class="actions">
      <a class="btn" href="add-subscription-loading.html">Try again</a>
    </div>

    <!-- All three failure states of this node land on the same place: the manual
         form. Nothing on this screen can leave a person unable to add one. -->
    <form class="form-col" onsubmit="return false">
      <fieldset>
        <div class="field">
          <label for="sub-name">Name</label>
          <input class="input" id="sub-name" type="text" placeholder="For example, Spotify Premium">
        </div>
        <div class="field affix">
          <label for="sub-amount">Amount</label>
          <span class="cur" aria-hidden="true">$</span>
          <input class="input" id="sub-amount" type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" placeholder="0.00">
          <p class="hint">Enter an amount, like $9.99</p>
        </div>
        <div class="field">
          <label for="sub-freq">Billing frequency</label>
          <select class="select" id="sub-freq">
            <option>Monthly</option>
            <option>Every 4 weeks</option>
            <option>Quarterly</option>
            <option>Yearly</option>
            <option>Custom</option>
          </select>
        </div>
        <div class="field">
          <label for="sub-next">Next payment date</label>
          <input class="input" id="sub-next" type="text" placeholder="Aug 3, 2026">
          <p class="hint">For example, Aug 3, 2026</p>
        </div>
      </fieldset>

      <div class="actions">
        <button type="submit" class="btn primary">Add subscription</button>
        <button type="button" class="btn">Add another</button>
      </div>
    </form>

    <div class="actions">
      <a class="btn primary" href="guided-reveal.html">See your subscriptions</a>
    </div>

  </main>

</div>

</div><!-- /stage -->
</div><!-- /layout -->

<script>
(function(){var s=document.getElementById('sidebar'),o=document.getElementById('sidebarOverlay'),t=document.getElementById('navToggle'),c=document.getElementById('sidebarClose');function op(){s.classList.add('open');o.classList.add('open');}function cl(){s.classList.remove('open');o.classList.remove('open');}if(t)t.addEventListener('click',op);if(c)c.addEventListener('click',cl);if(o)o.addEventListener('click',cl);})();
</script>
<script src="_nav.js"></script>
</body>
</html>
