<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Strava"><rect width="64" height="64" fill="#FC4C02"/><!-- ONE CHEVRON AND NOT TWO, 2026-08-17, second correction. The real mark is a pair, and both attempts at the pair were rejected on sight: the first drew them on one axis and they closed into a rhombus, the second used the true offset and the lower one reads as a V hanging under the upper one at 36px. At the size this set is actually seen, the second element is 14px of white that the eye resolves as a separate shape rather than as part of one. So the tile keeps the silhouette the mark is known by and drops the element that only works large. Bounds x 3.463 to 17.471, y 0 to 13.827; scale 2.604 puts it 36 tall in the 64 box, the same optical size as the Netflix N, and the translate centres those bounds rather than the viewBox. --><g fill="#ffffff" transform="translate(4.73 14) scale(2.604)"><path d="M10.463 0L17.471 13.827h-4.172L10.463 8.229l-2.831 5.598H3.463z"/></g></svg>
