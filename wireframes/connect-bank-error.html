<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Bank, connection failed - Tendd wireframe</title>
<link rel="stylesheet" href="_wf.css">
</head>
<body>
<div class="layout">
<div id="wf-sidebar"></div>
<div class="stage stage-app">

<div class="app flow">

  <header class="appbar">
    <a class="back" href="connect-bank.html">&lsaquo; Back</a>
    <span class="wordmark">Tendd</span>
    <span class="step">Step 2 of 3</span>
  </header>

  <main class="screen">

    <!-- Two ways out, and the manual one is on the error page itself. Declining
         the retry is where Flow A used to end in a person with no list at all. -->
    <div class="state" role="status" aria-live="polite">
      <h1>We could not connect to your bank</h1>
      <p>This is usually temporary. You can try again, or add your subscriptions yourself and connect later.</p>
    </div>

    <div class="actions">
      <a class="btn primary" href="connect-bank-loading.html">Try again</a>
      <a class="btn" href="add-subscription.html">Add them yourself</a>
    </div>

    <p class="quiet"><a href="home-empty.html">Do this later</a></p>

  </main>

</div>

</div><!-- /stage -->
</div><!-- /layout -->
<script src="_nav.js"></script>
</body>
</html>
