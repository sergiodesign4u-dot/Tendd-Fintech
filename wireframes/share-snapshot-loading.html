<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share Snapshot, making your card - Tendd wireframe</title>
<link rel="stylesheet" href="_wf.css">
</head>
<body>
<div class="layout">
<div id="wf-sidebar"></div>
<div class="stage stage-app">

<div class="app flow">

  <header class="appbar">
    <a class="back" href="cancel-win.html">&lsaquo; Back</a>
    <span class="wordmark">Tendd</span>
  </header>

  <main class="screen" aria-busy="true">

    <div class="lede">
      <h1>Share this win</h1>
      <p role="status" aria-live="polite">Making your card. This usually takes a moment.</p>
    </div>

    <!-- The skeleton is the card, in its own proportions: the wait ends in
         something specific, and the person can already see what. -->
    <div class="sharecard" aria-hidden="true">
      <span class="skel line w60"></span>
      <span class="skel total"></span>
      <span class="skel line w50"></span>
    </div>

    <p class="consequence">Nothing is shared while this is being made, and nothing is shared afterwards until you tap Share.</p>

  </main>

</div>

</div><!-- /stage -->
</div><!-- /layout -->
<script src="_nav.js"></script>
</body>
</html>
