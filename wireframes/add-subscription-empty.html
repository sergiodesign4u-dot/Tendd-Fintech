<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Subscription, no preset matches - Tendd wireframe</title>
<link rel="stylesheet" href="_wf.css">
</head>
<body>
<div class="layout">
<div id="wf-sidebar"></div>
<div class="stage stage-app">

<div class="app flow">

  <header class="appbar">
    <a class="back" href="path-choice.html">&lsaquo; Back</a>
    <span class="wordmark">Tendd</span>
    <span class="step">Step 2 of 3</span>
  </header>

  <main class="screen">

    <div class="lede">
      <h1>Add a subscription</h1>
    </div>

    <form class="field" role="search" onsubmit="return false">
      <label for="preset-search">Find a service</label>
      <input id="preset-search" type="search" value="Cerebro Cloud">
    </form>

    <!-- An empty catalogue result is our gap, not the person's mistake, and the
         line says so before it offers the way on. -->
    <div class="state" role="status" aria-live="polite">
      <h2>No match for "Cerebro Cloud"</h2>
      <p>Not every service is in our list yet. You can add it by hand below, and it will sit alongside the rest.</p>
    </div>

    <!-- The name carries over from the search, so nothing typed is retyped. -->
    <form class="form-col" onsubmit="return false">
      <!-- THE GROUP HAS A NAME, 2026-08-20. A `fieldset` with no `legend` is a group
      nobody can hear the name of, and it stood that way on all three states of this
      screen in both corpora since stage 07. Named with `aria-label` and not with a
      `legend`, deliberately: `fieldset` maps to role `group`, which DOES take a name
      from the author, so nothing is discarded here - and a `legend` is a VISIBLE
      heading this form was designed without, on the screen whose own comment says
      every extra thing here is a reason to close the tab. Founder, 2026-08-20:
      "давай чинить дыры какие есть". -->
      <fieldset aria-label="Details of this subscription">
        <div class="field">
          <label for="sub-name">Name</label>
          <input id="sub-name" type="text" value="Cerebro Cloud">
        </div>
        <div class="field affix">
          <label for="sub-amount">Amount</label>
          <span class="cur" aria-hidden="true">$</span>
          <input id="sub-amount" type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" placeholder="0.00">
          <p class="hint">Enter an amount, like $9.99</p>
        </div>
        <div class="field">
          <label for="sub-freq">Billing frequency</label>
          <select id="sub-freq">
            <option>Monthly</option>
            <option>Every 4 weeks</option>
            <option>Quarterly</option>
            <option>Yearly</option>
            <option>Custom</option>
          </select>
        </div>
        <div class="field">
          <label for="sub-next">Next payment date</label>
          <input id="sub-next" type="text" placeholder="Aug 3, 2026">
          <p class="hint">For example, Aug 3, 2026</p>
        </div>
      </fieldset>

      <div class="actions">
        <button type="submit" class="btn primary">Add subscription</button>
        <a class="btn" href="add-subscription.html">Search again</a>
      </div>
    </form>

    <div class="actions">
      <a class="btn primary" href="guided-reveal.html">See your subscriptions</a>
    </div>

  </main>

</div>

</div><!-- /stage -->
</div><!-- /layout -->
<script src="_nav.js"></script>
</body>
</html>
