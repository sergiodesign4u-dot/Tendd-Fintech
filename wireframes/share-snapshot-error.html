<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share Snapshot, could not create the card - Tendd wireframe</title>
<link rel="stylesheet" href="_wf.css">
</head>
<body>
<div class="layout">
<div id="wf-sidebar"></div>
<div class="stage stage-app">

<div class="app flow">

  <header class="appbar">
    <a class="back" href="cancel-win.html">&lsaquo; Back</a>
    <span class="wordmark">Tendd</span>
  </header>

  <main class="screen">

    <!-- Node 4.11.2. The card failed, the win did not. Saying which of the two
         broke is the whole job of this state: a person who just cancelled
         something must never wonder whether that was undone. -->
    <div class="state" role="status" aria-live="polite">
      <h1>We could not create the card</h1>
      <p>Nothing is wrong with your account, and your cancel win is saved. This is only the picture.</p>
    </div>

    <div class="actions">
      <a class="btn primary" href="share-snapshot.html">Try again</a>
      <a class="btn" href="home.html">Back to your subscriptions</a>
    </div>

    <p class="consequence">Nothing was shared, and nothing was posted anywhere.</p>

  </main>

</div>

</div><!-- /stage -->
</div><!-- /layout -->
<script src="_nav.js"></script>
</body>
</html>
