<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Subscription, presets unavailable - Tendd wireframe</title>
<link rel="stylesheet" href="_wf.css">
</head>
<body>
<div class="layout">
<div id="wf-sidebar"></div>
<div class="stage stage-app">

<div class="app flow">

  <header class="appbar">
    <a class="back" href="path-choice.html">&lsaquo; Back</a>
    <span class="wordmark">Tendd</span>
    <span class="step">Step 2 of 3</span>
  </header>

  <main class="screen">

    <div class="state" role="status" aria-live="polite">
      <h1>We could not load the service list</h1>
      <p>You can still add subscriptions by hand below, and the search will come back on its own.</p>
    </div>

    <div class="actions">
      <a class="btn" href="add-subscription-loading.html">Try again</a>
    </div>

    <!-- All three failure states of this node land on the same place: the manual
         form. Nothing on this screen can leave a person unable to add one. -->
    <form class="form-col" onsubmit="return false">
      <fieldset>
        <div class="field">
          <label for="sub-name">Name</label>
          <input id="sub-name" type="text" placeholder="For example, Spotify Premium">
        </div>
        <div class="field">
          <label for="sub-amount">Amount</label>
          <input id="sub-amount" type="text" placeholder="$0.00">
          <p class="hint">Enter an amount, like $9.99</p>
        </div>
        <div class="field">
          <label for="sub-freq">Billing frequency</label>
          <select id="sub-freq">
            <option>Monthly</option>
            <option>Every 4 weeks</option>
            <option>Quarterly</option>
            <option>Yearly</option>
            <option>Custom</option>
          </select>
        </div>
        <div class="field">
          <label for="sub-next">Next payment date</label>
          <input id="sub-next" type="text" placeholder="Aug 3, 2026">
          <p class="hint">For example, Aug 3, 2026</p>
        </div>
      </fieldset>

      <div class="actions">
        <button type="submit" class="btn primary">Add subscription</button>
        <button type="button" class="btn">Add another</button>
      </div>
    </form>

    <div class="actions">
      <a class="btn primary" href="guided-reveal.html">See your subscriptions</a>
    </div>

  </main>

</div>

</div><!-- /stage -->
</div><!-- /layout -->
<script src="_nav.js"></script>
</body>
</html>
