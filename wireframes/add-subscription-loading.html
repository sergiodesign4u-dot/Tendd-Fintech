<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Subscription, preset library loading - Tendd wireframe</title>
<link rel="stylesheet" href="_wf.css">
</head>
<body>
<div class="layout">
<div id="wf-sidebar"></div>
<div class="stage stage-app">

<div class="app flow">

  <header class="appbar">
    <a class="back" href="path-choice.html">&lsaquo; Back</a>
    <span class="wordmark">Tendd</span>
    <span class="step">Step 2 of 3</span>
  </header>

  <main class="screen" aria-busy="true">

    <div class="lede">
      <h1>Add a subscription</h1>
      <p role="status" aria-live="polite">Getting the list of services. This usually takes a moment.</p>
    </div>

    <!-- The search field works while the catalogue is still arriving: typing is
         the fastest path and there is no reason to take it away during a wait. -->
    <form class="field" role="search" onsubmit="return false">
      <label for="preset-search">Find a service</label>
      <input id="preset-search" type="search" placeholder="Search 400+ services" autofocus>
    </form>

    <h2 class="group-head plain"><span>Most tracked</span></h2>
    <div class="tiles" aria-hidden="true">
      <span class="tile"><span class="logo"></span><span><span class="skel line w60"></span><span class="skel line w90"></span></span></span>
      <span class="tile"><span class="logo"></span><span><span class="skel line w90"></span><span class="skel line w80"></span></span></span>
      <span class="tile"><span class="logo"></span><span><span class="skel line w50"></span><span class="skel line w90"></span></span></span>
      <span class="tile"><span class="logo"></span><span><span class="skel line w80"></span><span class="skel line w80"></span></span></span>
      <span class="tile"><span class="logo"></span><span><span class="skel line w90"></span><span class="skel line w90"></span></span></span>
      <span class="tile"><span class="logo"></span><span><span class="skel line w70"></span><span class="skel line w90"></span></span></span>
    </div>

    <p class="quiet">Can't find it? <a href="add-subscription-empty.html">Add it by hand</a> and fill the details yourself.</p>

  </main>

</div>

</div><!-- /stage -->
</div><!-- /layout -->
<script src="_nav.js"></script>
</body>
</html>
