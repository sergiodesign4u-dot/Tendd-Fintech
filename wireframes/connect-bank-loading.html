<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Bank, syncing your bank - Tendd wireframe</title>
<link rel="stylesheet" href="_wf.css">
</head>
<body>
<div class="layout">
<div id="wf-sidebar"></div>
<div class="stage stage-app">

<div class="app flow">

  <!-- No back control: Link has already returned and we are reading accounts.
       There is nothing here to cancel, and offering one would be theatre. -->
  <header class="appbar">
    <span class="wordmark">Tendd</span>
    <span class="step">Step 2 of 3</span>
  </header>

  <main class="screen" aria-busy="true">

    <div class="lede" role="status" aria-live="polite">
      <h1>Syncing your bank</h1>
      <p>We are reading your recurring charges, read-only. This usually takes a moment.</p>
    </div>

    <!-- The skeleton is in the shape of what is coming, which is the count and
         the first list of the reveal. That shape is the promise that the wait
         ends in something specific, and it is why there is no spinner here. -->
    <div aria-hidden="true">
      <span class="skel total"></span>
      <div style="margin-top:26px">
        <div class="row is-skel">
          <span class="logo is-skel"></span>
          <span class="body"><span class="skel line" style="width:58%"></span><span class="skel line short"></span></span>
          <span class="skel amt-skel"></span>
        </div>
        <div class="row is-skel">
          <span class="logo is-skel"></span>
          <span class="body"><span class="skel line" style="width:44%"></span><span class="skel line short"></span></span>
          <span class="skel amt-skel"></span>
        </div>
        <div class="row is-skel">
          <span class="logo is-skel"></span>
          <span class="body"><span class="skel line" style="width:66%"></span><span class="skel line short"></span></span>
          <span class="skel amt-skel"></span>
        </div>
      </div>
    </div>

  </main>

</div>

</div><!-- /stage -->
</div><!-- /layout -->
<script src="_nav.js"></script>
</body>
</html>
