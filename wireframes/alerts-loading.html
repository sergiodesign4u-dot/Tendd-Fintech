<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alerts, loading alerts - Tendd wireframe</title>
<link rel="stylesheet" href="_wf.css">
</head>
<body>
<div class="layout">
<div id="wf-sidebar"></div>
<div class="stage stage-app">

<div class="app">

  <header class="appbar">
    <span class="wordmark">Tendd</span>
    <a class="acct" href="settings.html" aria-label="Hi Emma, you are on the free plan, open your account">Hi, Emma<span class="plan">Free</span></a>
  </header>

  <main class="screen" aria-busy="true">
   <div class="rows-col">

    <div class="lede" role="status" aria-live="polite">
      <h1>Alerts</h1>
      <p>Checking for anything worth knowing about. This usually takes a moment.</p>
    </div>

    <!-- The skeleton keeps both group headings, because the shape of this screen
         is the answer to "is anything wrong" and the shape arrives first. -->
    <section class="group" aria-hidden="true">
      <div class="group-head"><h2>Needs you</h2></div>
      <ul class="alerts">
        <li><div class="alert">
          <span class="logo is-skel"></span>
          <span class="body"><span class="skel line w70"></span><span class="skel line w50"></span></span>
        </div></li>
      </ul>
    </section>

    <section class="group" aria-hidden="true">
      <div class="group-head"><h2>Just so you know</h2></div>
      <ul class="alerts">
        <li><div class="alert">
          <span class="logo is-skel"></span>
          <span class="body"><span class="skel line w60"></span><span class="skel line w50"></span></span>
        </div></li>
        <li><div class="alert">
          <span class="logo is-skel"></span>
          <span class="body"><span class="skel line w70"></span><span class="skel line w50"></span></span>
        </div></li>
        <li><div class="alert">
          <span class="logo is-skel"></span>
          <span class="body"><span class="skel line w60"></span><span class="skel line w40"></span></span>
        </div></li>
      </ul>
    </section>

   </div>
  </main>

  <nav class="tabbar" aria-label="Global navigation">
    <a href="home.html"><span class="ic"></span>Home</a>
    <a href="history-trends-locked.html"><span class="ic"></span>Trends</a>
    <a class="cur" href="alerts.html" aria-current="page"><span class="ic"></span>Alerts</a>
    <a href="settings.html"><span class="ic"></span>You</a>
  </nav>

</div>

</div><!-- /stage -->
</div><!-- /layout -->
<script src="_nav.js"></script>
</body>
</html>
