<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guided Reveal, nothing to reveal yet - Tendd wireframe</title>
<link rel="stylesheet" href="_wf.css">
</head>
<body>
<div class="layout">
<div id="wf-sidebar"></div>
<div class="stage stage-app">

<div class="app flow">

  <header class="appbar">
    <span class="wordmark">Tendd</span>
    <span class="step">Step 3 of 3</span>
  </header>

  <main class="screen">

    <!-- The reveal arrived with nothing to reveal. It guards against the case
         where the manual path ends here before anything has been added. -->
    <div class="state" role="status" aria-live="polite">
      <h1>Nothing to reveal yet</h1>
      <p>Add at least one subscription and your list appears here. Even a partial list is saved, so you can come back any time.</p>
    </div>

    <div class="actions">
      <a class="btn primary" href="add-subscription.html">Add a subscription</a>
    </div>

    <p class="quiet"><a href="home-empty.html">Do this later</a></p>

  </main>

</div>

</div><!-- /stage -->
</div><!-- /layout -->
<script src="_nav.js"></script>
</body>
</html>
