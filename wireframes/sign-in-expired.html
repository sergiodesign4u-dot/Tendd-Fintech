<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In, that link has expired - Tendd wireframe</title>
<link rel="stylesheet" href="_wf.css">
</head>
<body>
<div class="layout">
<div id="wf-sidebar"></div>
<div class="stage stage-app">

<div class="app flow">

  <header class="appbar">
    <a class="back" href="sign-in.html">&lsaquo; Back</a>
    <span class="wordmark">Tendd</span>
  </header>

  <main class="screen">

    <!-- Node 1.6.2. Links expiring is maintenance, not a failure, and it is
         written in the same register node 6.14.2 uses for a bank connection
         that needs reconnecting: nothing was lost, and the screen says so
         before it asks for anything. -->
    <div class="state" role="status" aria-live="polite">
      <h1>That link has expired</h1>
      <p>A sign-in link works once and then stops, which is what keeps an old email from being a way in. Nothing is wrong with your account and nothing was lost.</p>
    </div>

    <div class="actions">
      <a class="btn primary" href="sign-in-sent.html">Send a new link</a>
    </div>

    <p class="quiet"><a href="sign-in.html">Use a different email</a></p>

  </main>

</div>

</div><!-- /stage -->
</div><!-- /layout -->
<script src="_nav.js"></script>
</body>
</html>
