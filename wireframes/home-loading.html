<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home, refreshing - Tendd wireframe</title>
<link rel="stylesheet" href="_wf.css">
</head>
<body>
<div class="layout">
<div id="wf-sidebar"></div>
<div class="stage stage-app">

<div class="app">

  <header class="appbar">
    <span class="wordmark">Tendd</span>
    <a class="acct" href="settings.html" aria-label="Hi Emma, open your account">Hi, Emma</a>
  </header>
  <main class="screen">

    <div class="head">
      <section class="summary" role="status">
        <h1>Getting your subscriptions</h1>
        <p class="context">This usually takes a moment.</p>
        <span class="skel total" aria-hidden="true"></span>
      </section>
    </div>

    <!-- A skeleton in the shape of the content, never a spinner over the screen -->
    <div class="groups">

      <section class="group">
        <div class="group-head" aria-hidden="true">
          <span class="skel line"></span>
          <span class="skel line"></span>
        </div>
        <ul>
          <li><div class="row is-skel" aria-hidden="true">
            <span class="logo is-skel"></span>
            <span class="body"><span class="skel line w60"></span><span class="skel line short"></span></span>
            <span class="skel amt-skel"></span>
          </div></li>
          <li><div class="row is-skel" aria-hidden="true">
            <span class="logo is-skel"></span>
            <span class="body"><span class="skel line w40"></span><span class="skel line short"></span></span>
            <span class="skel amt-skel"></span>
          </div></li>
          <li><div class="row is-skel" aria-hidden="true">
            <span class="logo is-skel"></span>
            <span class="body"><span class="skel line w70"></span><span class="skel line short"></span></span>
            <span class="skel amt-skel"></span>
          </div></li>
          <li><div class="row is-skel" aria-hidden="true">
            <span class="logo is-skel"></span>
            <span class="body"><span class="skel line w50"></span><span class="skel line short"></span></span>
            <span class="skel amt-skel"></span>
          </div></li>
        </ul>
      </section>

      <section class="group">
        <div class="group-head" aria-hidden="true">
          <span class="skel line"></span>
          <span class="skel line"></span>
        </div>
        <ul>
          <li><div class="row is-skel" aria-hidden="true">
            <span class="logo is-skel"></span>
            <span class="body"><span class="skel line w60"></span><span class="skel line short"></span></span>
            <span class="skel amt-skel"></span>
          </div></li>
          <li><div class="row is-skel" aria-hidden="true">
            <span class="logo is-skel"></span>
            <span class="body"><span class="skel line w40"></span><span class="skel line short"></span></span>
            <span class="skel amt-skel"></span>
          </div></li>
          <li><div class="row is-skel" aria-hidden="true">
            <span class="logo is-skel"></span>
            <span class="body"><span class="skel line w70"></span><span class="skel line short"></span></span>
            <span class="skel amt-skel"></span>
          </div></li>
        </ul>
      </section>

    </div><!-- /groups -->

  </main>
  <nav class="tabbar" aria-label="Global navigation">
    <a class="cur" href="home.html" aria-current="page"><span class="ic"></span>Home</a>
    <a href="alerts.html"><span class="ic"><span class="dot" role="img" aria-label="new alerts"></span></span>Alerts</a>
    <a href="home-savefocus.html"><span class="ic"></span>Save</a>
    <a href="settings.html"><span class="ic"></span>You</a>
  </nav>
</div>

</div><!-- /stage -->
</div><!-- /layout -->
<script src="_nav.js"></script>
</body>
</html>
