<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subscription Detail, loading the detail - Tendd wireframe</title>
<link rel="stylesheet" href="_wf.css">
</head>
<body>
<div class="layout">
<div id="wf-sidebar"></div>
<div class="stage stage-app">

<div class="app detail">

  <header class="appbar">
    <a class="back" href="home.html">&lsaquo; Your subscriptions</a>
    <span class="wordmark">Tendd</span>
  </header>

  <main class="screen" aria-busy="true">

    <div class="col1">

      <!-- The hero is already filled, because the list the person tapped knew
           the name and the amount. Blanking it out and asking them to wait for
           what they had a moment ago is the thing this state must not do. -->
      <div class="hero">
        <span class="logo">[logo]</span>
        <span>
          <h1>Spotify Premium</h1>
          <span class="amt">$11.99</span>
          <span class="cycle">a month</span>
        </span>
      </div>

      <p class="context" role="status" aria-live="polite" style="margin:0 0 20px;font-size:13px;color:var(--soft)">Getting the details. This usually takes a moment.</p>

      <dl class="facts" aria-hidden="true">
        <div><dt><span class="skel line" style="width:90px"></span></dt><dd><span class="skel line" style="width:120px"></span></dd></div>
        <div><dt><span class="skel line" style="width:80px"></span></dt><dd><span class="skel line" style="width:70px"></span></dd></div>
        <div><dt><span class="skel line" style="width:74px"></span></dt><dd><span class="skel line" style="width:110px"></span></dd></div>
        <div><dt><span class="skel line" style="width:66px"></span></dt><dd><span class="skel line" style="width:60px"></span></dd></div>
        <div><dt><span class="skel line" style="width:84px"></span></dt><dd><span class="skel line" style="width:140px"></span></dd></div>
      </dl>

      <section class="decoder" aria-hidden="true">
        <span class="skel line" style="width:60%"></span>
        <span class="skel line" style="width:80%;margin-top:8px"></span>
      </section>

    </div>

    <div class="col2">

      <section class="panel" aria-hidden="true">
        <h2>Recent charges</h2>
        <ul class="charges">
          <li><span class="skel line" style="width:54px"></span><span class="skel line" style="width:56px"></span></li>
          <li><span class="skel line" style="width:54px"></span><span class="skel line" style="width:56px"></span></li>
          <li><span class="skel line" style="width:54px"></span><span class="skel line" style="width:56px"></span></li>
        </ul>
      </section>

      <section class="trust" aria-label="Where these figures come from">
        <p>From Chase, read-only. Tendd cannot move your money.</p>
        <p>Last checked today, 9:14 AM.</p>
        <a href="data-privacy.html">Data and privacy</a>
      </section>

    </div>

  </main>

  <nav class="tabbar" aria-label="Global navigation">
    <a class="cur" href="home.html" aria-current="page"><span class="ic"></span>Home</a>
    <a href="alerts.html"><span class="ic"><span class="dot" role="img" aria-label="new alerts"></span></span>Alerts</a>
    <a href="home-savefocus.html"><span class="ic"></span>Save</a>
    <a href="settings.html"><span class="ic"></span>You</a>
  </nav>

</div>

</div><!-- /stage -->
</div><!-- /layout -->
<script src="_nav.js"></script>
</body>
</html>
