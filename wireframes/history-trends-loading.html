<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History and Trends, loading history - Tendd wireframe</title>
<link rel="stylesheet" href="_wf.css">
</head>
<body>
<div class="layout">
<div id="wf-sidebar"></div>
<div class="stage stage-app">

<div class="app">

  <header class="appbar">
    <a class="back" href="home.html">&lsaquo; Your subscriptions</a>
    <span class="wordmark">Tendd</span>
    <span class="plan">Pro</span>
  </header>

  <main class="screen" aria-busy="true">

    <!-- STRUCTURE FOLLOWS 5.12, 2026-08-19. The screen this is the wait for gained
         a head and a two-column body on the founder's decision, and a skeleton that
         is not the shape of what arrives is a second layout the person has to
         re-read the moment it lands. The argument is in history-trends.html. -->
    <div class="head">

      <div class="lede">
        <h1>Your trends</h1>
        <p role="status" aria-live="polite">Adding up your last few months. This usually takes a moment.</p>
      </div>

      <!-- The range control is real while the numbers arrive: it is the frame, and
           it does not move when they land. -->
      <div class="range" role="group" aria-label="Choose a time range">
        <button type="button" aria-pressed="true">3 months</button>
        <button type="button" aria-pressed="false">6 months</button>
        <button type="button" aria-pressed="false">12 months</button>
      </div>

    </div>

    <!-- A skeleton in the shape of the chart, never a spinner over the screen:
         the same rule as every other wait in this product. The frame is the
         screen's own block, so it is the height the loaded one takes. -->
    <div aria-hidden="true">
      <span class="skel total"></span>
      <span class="skel line w80"></span>
      <span class="skel line w50"></span>
    </div>
    <div class="chart" aria-hidden="true">[chart]</div>

    <div class="pair">

      <section class="group" aria-hidden="true">
        <div class="group-head"><span class="skel line"></span><span class="skel line"></span></div>
        <ul>
          <li><div class="row is-skel">
            <span class="logo is-skel"></span>
            <span class="body"><span class="skel line w60"></span><span class="skel line w80"></span></span>
          </div></li>
          <li><div class="row is-skel">
            <span class="logo is-skel"></span>
            <span class="body"><span class="skel line w50"></span><span class="skel line w70"></span></span>
          </div></li>
          <li><div class="row is-skel">
            <span class="logo is-skel"></span>
            <span class="body"><span class="skel line w70"></span><span class="skel line w60"></span></span>
          </div></li>
        </ul>
      </section>

      <!-- The bars with no lengths yet. An empty track IS what a bar looks like
           before its figure arrives, so nothing stands in for one. -->
      <section class="group" aria-hidden="true">
        <div class="group-head"><span class="skel line"></span><span class="skel line"></span></div>
        <ul class="bars">
          <li><span class="skel line w60"></span><span class="skel line w50"></span><span class="bar"></span></li>
          <li><span class="skel line w50"></span><span class="skel line w50"></span><span class="bar"></span></li>
          <li><span class="skel line w70"></span><span class="skel line w50"></span><span class="bar"></span></li>
          <li><span class="skel line w40"></span><span class="skel line w50"></span><span class="bar"></span></li>
          <li><span class="skel line w60"></span><span class="skel line w50"></span><span class="bar"></span></li>
        </ul>
      </section>

    </div>

  </main>

  <nav class="tabbar" aria-label="Global navigation">
    <a href="home.html"><span class="ic"></span>Home</a>
    <a class="cur" href="history-trends-loading.html" aria-current="page"><span class="ic"></span>Trends</a>
    <a href="alerts.html"><span class="ic"><span class="dot" role="img" aria-label="new alerts"></span></span>Alerts</a>
    <a href="home-savefocus.html"><span class="ic"></span>Save</a>
    <a href="settings.html"><span class="ic"></span>You</a>
  </nav>

</div>

</div><!-- /stage -->
</div><!-- /layout -->
<script src="_nav.js"></script>
</body>
</html>
