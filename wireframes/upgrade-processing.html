<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upgrade, setting up your plan - Tendd wireframe</title>
<link rel="stylesheet" href="_wf.css">
</head>
<body>
<div class="layout">
<div id="wf-sidebar"></div>
<div class="stage stage-app">

<div class="app flow">

  <!-- Node 5.13.1. The payment provider owns its own sheet; we own the wait
       around it, in our own voice. No close here: a person must not be able to
       leave in the middle of a charge and wonder whether it went through. -->
  <header class="appbar">
    <span class="wordmark">Tendd</span>
    <span class="plan">Free</span>
  </header>

  <main class="screen" aria-busy="true">

    <div class="state" role="status" aria-live="polite">
      <h1>Setting up your Pro plan</h1>
      <p>This takes a few seconds. Do not close this page, and nothing is charged twice if it takes a moment longer.</p>
    </div>

    <div aria-hidden="true">
      <span class="skel line w70"></span>
      <span class="skel line w50"></span>
    </div>

    <!-- What happens next, stated before it happens: the person returns to the
         thing they wanted, and there is no celebration screen on the way. -->
    <!-- THE PROMISE GAINED ITS LINK, 2026-08-20. This sentence said "you go
         straight back to Your trends, open" and the page carried NO outgoing link
         at all, so the one crossing from Free to Pro in the whole product dead
         ended at the exact moment it promised delivery. Measured before the fix:
         21 pages send the Trends tab to the gate, 0 send it to the open view, and
         `history-trends.html` was reachable from nothing but the reviewer's
         sidebar. `add-subscription-loading.html` already sets the convention for a
         wait in a chain - the way on is a link inside the sentence that describes
         it, not a button the wait does not have. -->
    <p class="consequence spaced">When it is done you go straight back to <a href="history-trends.html">Your trends</a>, open.</p>

  </main>

</div>

</div><!-- /stage -->
</div><!-- /layout -->
<script src="_nav.js"></script>
</body>
</html>
