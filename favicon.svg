<svg xmlns="http://www.w3.org/2000/svg" viewBox="26 34 46 46" width="46" height="46" role="img" aria-label="Tendd">
  <!-- Crop A of the Tendd mark. The letterform is drawn once on a 100 unit square
       and this file is the window x26 y34, 46 by 46, cut out of it: the same four
       numbers of geometry that design/system/components/brand-mark.css masks with,
       and the same viewBox. Rule 1 of the mark, the letter is never redrawn.
       Rule 5: below 16px it is crop A or nothing, and this is the file that has to
       survive 16px.

       THE HEX IS UNAVOIDABLE AND THE PAIR IS NOT. A favicon is fetched as its own
       document and cannot read a custom property from the page, so the four values
       below are the only literals of this brand outside a token file. They are
       copied from design/system/tokens.css and are not chosen here:
         --paper       #ffffff    --petrol       #1c6a76
         --paper-dark  #161f21    --petrol-dark  #6bb0ba
       The dark pair is carried through prefers-color-scheme rather than dropped,
       because a role without a pair does not exist in this system and a tab strip
       is a ground like any other. -->
  <style>
    :root { --field: #ffffff; --letter: #1c6a76 }
    @media (prefers-color-scheme: dark) { :root { --field: #161f21; --letter: #6bb0ba } }
  </style>
  <defs>
    <clipPath id="w"><rect x="26" y="34" width="46" height="46" rx="10.8"/></clipPath>
  </defs>
  <rect x="26" y="34" width="46" height="46" rx="10.8" fill="var(--field)"/>
  <g clip-path="url(#w)">
    <circle cx="40" cy="60" r="23" fill="none" stroke="var(--letter)" stroke-width="15"/>
    <rect x="64" y="6" width="15" height="84" rx="7.5" fill="var(--letter)"/>
  </g>
</svg>
