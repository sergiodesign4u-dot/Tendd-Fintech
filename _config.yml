# GitHub Pages (Jekyll) configuration.
#
# Jekyll excludes files and folders whose names start with "_" from the built
# site by default. This project keeps its shell assets behind that prefix, and
# every page links at least one of them, so they must be force-included or the
# pages render with no styles and no navigation:
#   /_nav.js, /_nav.css          the project roadmap registry and its look (every page)
#   wireframes/_nav.js, _wf.css  the grey prototype shell
#   design/_nav.js, _screen.css  the color screen map and the reviewer's chrome
#   design/kit/_nav.js, _page.css  the design system registry and the stand look
# design/system/ has no underscore anywhere, so Jekyll serves it without an
# include. design/kit/kit.css was in the same position and is deleted at step 8.
# Both the basename and the full path are listed so the match holds regardless
# of how Jekyll walks the tree.
include:
  - "ia/_nav.js"
  - "_nav.js"
  - "_nav.css"
  - "_wf.css"
  - "wireframes/_nav.js"
  - "wireframes/_wf.css"
  - "design/_nav.js"
  - "design/_screen.css"
  - "_screen.css"
  - "design/kit/_nav.js"
  - "design/kit/_page.css"
